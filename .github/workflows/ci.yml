name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: sh test/astrycs_test.sh
      - name: Run tests under dash
        run: dash test/astrycs_test.sh
      - name: Lint
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not present on this runner; installing"
            brew install shellcheck
          fi
          shellcheck bin/astrycs test/astrycs_test.sh
