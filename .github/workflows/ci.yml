name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: sh test/astrycs_test.sh
      - name: Lint
        run: shellcheck bin/astrycs test/astrycs_test.sh
